<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <rect width="144" height="144" fill="#0a0f14" rx="18"/>
  <!-- Branche principale (vertical) -->
  <line x1="52" y1="30" x2="52" y2="100" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nœud bas -->
  <circle cx="52" cy="100" r="6" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <!-- Nœud haut -->
  <circle cx="52" cy="30" r="6" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <!-- Branche dérivée -->
  <path d="M52 55 Q52 44 62 44 L86 44" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nœud nouvelle branche -->
  <circle cx="92" cy="44" r="7" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="2.5"/>
  <!-- Signe + -->
  <line x1="92" y1="38" x2="92" y2="50" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <line x1="86" y1="44" x2="98" y2="44" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <text x="72" y="118" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1">BRANCH</text>
</svg>
