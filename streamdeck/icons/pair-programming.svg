<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <rect width="144" height="144" fill="#0a0f14" rx="18"/>
  <!-- Fenêtre gauche (code) -->
  <rect x="18" y="36" width="46" height="60" rx="4" fill="none" stroke="#a855f7" stroke-width="2"/>
  <line x1="18" y1="48" x2="64" y2="48" stroke="#a855f7" stroke-width="1.5"/>
  <line x1="26" y1="58" x2="56" y2="58" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="66" x2="52" y2="66" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="74" x2="58" y2="74" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Fenêtre droite (terminal) -->
  <rect x="80" y="36" width="46" height="60" rx="4" fill="none" stroke="#a855f7" stroke-width="2"/>
  <line x1="80" y1="48" x2="126" y2="48" stroke="#a855f7" stroke-width="1.5"/>
  <text x="88" y="63" fill="#a855f7" font-family="monospace" font-size="9">$ claude</text>
  <line x1="88" y1="72" x2="118" y2="72" stroke="#a855f7" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="88" y1="80" x2="112" y2="80" stroke="#a855f7" stroke-width="1" stroke-linecap="round" stroke-opacity="0.4"/>
  <!-- Connecteur central -->
  <line x1="64" y1="66" x2="80" y2="66" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="72" y="118" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1">LAYOUT</text>
</svg>
